# Full Unigram (Telegram for Windows) build with BetterTG sources injected.
# Heavy: vcpkg + TDLib + WinUI 3 / .NET 11. workflow_dispatch only.
name: Build Unigram Client (BetterTG)

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout BetterTG (for Windows extension sources)
        uses: actions/checkout@v4
        with:
          path: BetterTG

      - name: Verify API secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TELEGRAM_API_ID }}")) {
            throw "Missing secret TELEGRAM_API_ID"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TELEGRAM_API_HASH }}")) {
            throw "Missing secret TELEGRAM_API_HASH"
          }
          Write-Host "API secrets present."

      - name: Setup MSVC / dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup PHP (TDLib codegen)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup .NET 11 (Unigram develop TFM)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
            8.0.x

      - name: Clone Unigram (recursive, develop)
        shell: pwsh
        run: |
          git clone --recursive --depth 1 --branch develop https://github.com/TelegramMessenger/Unigram.git Unigram
          cd Unigram
          git submodule update --init --recursive --depth 1
          Write-Host "Unigram HEAD: $(git rev-parse --short HEAD)"
          Get-ChildItem | Select-Object Name

      - name: Write Constants.Secret.cs
        shell: pwsh
        run: |
          $apiId = "${{ secrets.TELEGRAM_API_ID }}"
          $apiHash = "${{ secrets.TELEGRAM_API_HASH }}"
          $lines = @(
            'namespace Telegram',
            '{',
            '    public static partial class Constants',
            '    {',
            '        static Constants()',
            '        {',
            "            ApiId = $apiId;",
            "            ApiHash = `"$apiHash`";",
            '            AppChannel = "";',
            '        }',
            '    }',
            '}'
          )
          $path = "Unigram/Telegram/Constants.Secret.cs"
          Set-Content -Path $path -Value ($lines -join "`n") -Encoding UTF8
          Write-Host "Wrote $path"

      - name: Inject BetterTG sources
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File BetterTG/Windows/UnigramIntegration/Inject-BetterTG.ps1 -UnigramRoot (Resolve-Path Unigram) -BetterTGWindowsRoot (Resolve-Path BetterTG/Windows)

      - name: Patch tool output paths (AnyCPU tools vs x64 app)
        working-directory: Unigram
        shell: pwsh
        run: |
          # Unigram expects build tools under bin\Release\net11.0 but solution Platform=x64
          # places them under bin\x64\Release\net11.0. Patch targets to accept both.
          $td = "Telegram\TdSchema.targets"
          $text = Get-Content $td -Raw
          $old = '<TdSchemaCliDir>$(MSBuildThisFileDirectory)..\Telegram.Generators.Cli\bin\$(Configuration)\net11.0</TdSchemaCliDir>'
          $new = @'
<TdSchemaCliDir>$(MSBuildThisFileDirectory)..\Telegram.Generators.Cli\bin\$(Configuration)\net11.0</TdSchemaCliDir>
    <TdSchemaCliDir Condition="!Exists('$(TdSchemaCliDir)\Telegram.Generators.Cli.dll')">$(MSBuildThisFileDirectory)..\Telegram.Generators.Cli\bin\x64\$(Configuration)\net11.0</TdSchemaCliDir>
    <TdSchemaCliDir Condition="!Exists('$(TdSchemaCliDir)\Telegram.Generators.Cli.dll')">$(MSBuildThisFileDirectory)..\Telegram.Generators.Cli\bin\AnyCPU\$(Configuration)\net11.0</TdSchemaCliDir>
'@
          if ($text -notlike "*$($old.Substring(0,40))*") { throw "TdSchema.targets pattern not found" }
          $text = $text.Replace($old, $new)
          Set-Content -Path $td -Value $text -Encoding UTF8
          Write-Host "Patched TdSchema.targets"

          $winui = "Telegram\Telegram.WinUI.csproj"
          $w = Get-Content $winui -Raw
          $oldR = '<WinUIRewriter>$(MSBuildThisFileDirectory)..\Telegram.WinUI.Rewriter\bin\$(Configuration)\net11.0\Telegram.WinUI.Rewriter.dll</WinUIRewriter>'
          $newR = @'
<WinUIRewriter>$(MSBuildThisFileDirectory)..\Telegram.WinUI.Rewriter\bin\$(Configuration)\net11.0\Telegram.WinUI.Rewriter.dll</WinUIRewriter>
    <WinUIRewriter Condition="!Exists('$(WinUIRewriter)')">$(MSBuildThisFileDirectory)..\Telegram.WinUI.Rewriter\bin\x64\$(Configuration)\net11.0\Telegram.WinUI.Rewriter.dll</WinUIRewriter>
'@
          if ($w -notlike "*WinUIRewriter*") { throw "WinUIRewriter not found" }
          $w = $w.Replace($oldR, $newR)
          Set-Content -Path $winui -Value $w -Encoding UTF8
          Write-Host "Patched Telegram.WinUI.csproj Rewriter path"

      - name: Pre-build AnyCPU build tools
        working-directory: Unigram
        shell: pwsh
        run: |
          function Ensure-Tool([string]$proj, [string]$dllName, [string]$expectedRel) {
            Write-Host "Building $proj ..."
            dotnet build $proj -c Release -p:Platform=AnyCPU -v:minimal
            $expected = Join-Path (Get-Location) $expectedRel
            $dir = Split-Path $expected -Parent
            if (-not (Test-Path $expected)) {
              $found = Get-ChildItem -Recurse (Split-Path $proj -Parent) -Filter $dllName -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
              if (-not $found) { throw "$dllName not produced for $proj" }
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              Copy-Item $found.FullName $expected -Force
              # also copy sibling deps from same folder
              Get-ChildItem $found.DirectoryName -Filter "*.dll" | ForEach-Object {
                Copy-Item $_.FullName (Join-Path $dir $_.Name) -Force
              }
              Write-Host "Copied $($found.FullName) -> $expected"
            } else {
              Write-Host "OK $expected"
            }
          }
          Ensure-Tool "Telegram.WinUI.Rewriter\Telegram.WinUI.Rewriter.csproj" "Telegram.WinUI.Rewriter.dll" "Telegram.WinUI.Rewriter\bin\Release\net11.0\Telegram.WinUI.Rewriter.dll"
          Ensure-Tool "Telegram.Generators.Cli\Telegram.Generators.Cli.csproj" "Telegram.Generators.Cli.dll" "Telegram.Generators.Cli\bin\Release\net11.0\Telegram.Generators.Cli.dll"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TDLib (x64 windows)
        working-directory: Unigram/Libraries/tdjson
        shell: pwsh
        run: |
          if (-not (Test-Path .\build.ps1)) { throw "tdjson/build.ps1 missing" }
          powershell -ExecutionPolicy Bypass ./build.ps1 -arch x64
          $tl = Join-Path (Get-Location) "td_api.tl"
          if (-not (Test-Path $tl)) {
            $found = Get-ChildItem -Recurse -Filter "td_api.tl" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Copy-Item $found.FullName $tl -Force
              Write-Host "Copied td_api.tl from $($found.FullName)"
            } else {
              Write-Host "WARNING: td_api.tl not found after TDLib build"
              Get-ChildItem -Recurse -Filter "*.tl" | Select-Object FullName
            }
          } else {
            Write-Host "td_api.tl present ($((Get-Item $tl).Length) bytes)"
          }

      - name: Re-sync build tools to expected paths
        working-directory: Unigram
        shell: pwsh
        run: |
          # MSBuild may have rebuilt tools under bin\x64 during dependency walk; re-copy.
          function Sync-Tool([string]$searchRoot, [string]$dllName, [string]$destRel) {
            $dest = Join-Path (Get-Location) $destRel
            $dir = Split-Path $dest -Parent
            $found = Get-ChildItem -Recurse $searchRoot -Filter $dllName -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\bin\\' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $found) { Write-Host "WARN: $dllName not found under $searchRoot"; return }
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item $found.FullName $dest -Force
            Get-ChildItem $found.DirectoryName -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName (Join-Path $dir $_.Name) -Force
            }
            Write-Host "Synced $($found.FullName) -> $dest"
          }
          Sync-Tool "Telegram.WinUI.Rewriter" "Telegram.WinUI.Rewriter.dll" "Telegram.WinUI.Rewriter\bin\Release\net11.0\Telegram.WinUI.Rewriter.dll"
          Sync-Tool "Telegram.Generators.Cli" "Telegram.Generators.Cli.dll" "Telegram.Generators.Cli\bin\Release\net11.0\Telegram.Generators.Cli.dll"
          Sync-Tool "Telegram.Generators" "Telegram.Generators.dll" "Telegram.Generators.Cli\bin\Release\net11.0\Telegram.Generators.dll"

      - name: Build Unigram WinUI unpackaged (Release x64)
        working-directory: Unigram
        shell: pwsh
        run: |
          if (-not (Test-Path .\Build.WinUI.ps1)) { throw "Build.WinUI.ps1 missing" }
          Write-Host "Running Build.WinUI.ps1 -Unpackaged"
          powershell -ExecutionPolicy Bypass -File .\Build.WinUI.ps1 -Configuration Release -Platform x64 -Unpackaged

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Recurse Unigram\Telegram\bin -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'publish' -or $_.FullName -match 'winui-unpackaged' } |
            ForEach-Object {
              Write-Host "Found publish dir: $($_.FullName)"
              Copy-Item $_.FullName "out\publish" -Recurse -Force -ErrorAction SilentlyContinue
            }
          Get-ChildItem -Recurse Unigram -Include *.msix,*.msixbundle,*.appx -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName out\ -Force }
          Get-ChildItem -Recurse Unigram -Filter "Telegram*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Release|publish|winui' } |
            Select-Object -First 20 |
            ForEach-Object {
              Write-Host "Found exe: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)"
              Copy-Item $_.FullName out\ -Force -ErrorAction SilentlyContinue
            }
          Write-Host "=== out/ ==="
          Get-ChildItem -Recurse out -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Unigram-BetterTG-client
          path: out/**
          if-no-files-found: warn
