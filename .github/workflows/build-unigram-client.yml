# Full Unigram (Telegram for Windows) build with BetterTG sources injected.
# Heavy: vcpkg + TDLib + WinUI 3 / .NET 11. workflow_dispatch only.
name: Build Unigram Client (BetterTG)

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout BetterTG (for Windows extension sources)
        uses: actions/checkout@v4
        with:
          path: BetterTG

      - name: Verify API secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TELEGRAM_API_ID }}")) { throw "Missing secret TELEGRAM_API_ID" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TELEGRAM_API_HASH }}")) { throw "Missing secret TELEGRAM_API_HASH" }
          Write-Host "API secrets present."

      - name: Setup MSVC / dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup PHP (TDLib codegen)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup .NET 11 (Unigram develop TFM)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
            8.0.x

      - name: Clone Unigram (recursive, develop)
        shell: pwsh
        run: |
          git clone --recursive --depth 1 --branch develop https://github.com/TelegramMessenger/Unigram.git Unigram
          cd Unigram
          git submodule update --init --recursive --depth 1
          Write-Host "Unigram HEAD: $(git rev-parse --short HEAD)"

      - name: Write Constants.Secret.cs
        shell: pwsh
        run: |
          $apiId = "${{ secrets.TELEGRAM_API_ID }}"
          $apiHash = "${{ secrets.TELEGRAM_API_HASH }}"
          $lines = @(
            'namespace Telegram',
            '{',
            '    public static partial class Constants',
            '    {',
            '        static Constants()',
            '        {',
            "            ApiId = $apiId;",
            "            ApiHash = `"$apiHash`";",
            '            AppChannel = "";',
            '        }',
            '    }',
            '}'
          )
          Set-Content -Path "Unigram/Telegram/Constants.Secret.cs" -Value ($lines -join "`n") -Encoding UTF8

      - name: Inject BetterTG sources
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File BetterTG/Windows/UnigramIntegration/Inject-BetterTG.ps1 -UnigramRoot (Resolve-Path Unigram) -BetterTGWindowsRoot (Resolve-Path BetterTG/Windows)

      - name: Pre-build AnyCPU tools and stage to expected paths
        working-directory: Unigram
        shell: pwsh
        run: |
          function Stage-Tool($searchRoot, $dllName, $destRel) {
            $dest = [System.IO.Path]::GetFullPath((Join-Path (Get-Location) $destRel))
            $dir = Split-Path $dest -Parent
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $found = Get-ChildItem -Recurse $searchRoot -Filter $dllName -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\bin\\' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $found) { throw "$dllName not found under $searchRoot" }
            $src = [System.IO.Path]::GetFullPath($found.FullName)
            if ($src -ne $dest) {
              Copy-Item $src $dest -Force
              Write-Host "Staged $src -> $dest"
            } else {
              Write-Host "Already at $dest"
            }
            Get-ChildItem $found.DirectoryName -Filter '*.dll' | ForEach-Object {
              $d2 = Join-Path $dir $_.Name
              $s2 = [System.IO.Path]::GetFullPath($_.FullName)
              $d2f = [System.IO.Path]::GetFullPath($d2)
              if ($s2 -ne $d2f) { Copy-Item $s2 $d2f -Force }
            }
          }
          dotnet build Telegram.WinUI.Rewriter\Telegram.WinUI.Rewriter.csproj -c Release -p:Platform=AnyCPU -v:minimal
          dotnet build Telegram.Generators.Cli\Telegram.Generators.Cli.csproj -c Release -p:Platform=AnyCPU -v:minimal
          Stage-Tool Telegram.WinUI.Rewriter Telegram.WinUI.Rewriter.dll Telegram.WinUI.Rewriter\bin\Release\net11.0\Telegram.WinUI.Rewriter.dll
          Stage-Tool Telegram.Generators.Cli Telegram.Generators.Cli.dll Telegram.Generators.Cli\bin\Release\net11.0\Telegram.Generators.Cli.dll
          Stage-Tool Telegram.Generators Telegram.Generators.dll Telegram.Generators.Cli\bin\Release\net11.0\Telegram.Generators.dll
          # mirror to x64 path used when Platform leaks
          Stage-Tool Telegram.WinUI.Rewriter Telegram.WinUI.Rewriter.dll Telegram.WinUI.Rewriter\bin\x64\Release\net11.0\Telegram.WinUI.Rewriter.dll
          Stage-Tool Telegram.Generators.Cli Telegram.Generators.Cli.dll Telegram.Generators.Cli\bin\x64\Release\net11.0\Telegram.Generators.Cli.dll
          Stage-Tool Telegram.Generators Telegram.Generators.dll Telegram.Generators.Cli\bin\x64\Release\net11.0\Telegram.Generators.dll

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TDLib (x64 windows)
        working-directory: Unigram/Libraries/tdjson
        shell: pwsh
        run: |
          if (-not (Test-Path .\build.ps1)) { throw "tdjson/build.ps1 missing" }
          powershell -ExecutionPolicy Bypass ./build.ps1 -arch x64 -target windows
          $tl = Join-Path (Get-Location) "td_api.tl"
          if (-not (Test-Path $tl)) {
            $found = Get-ChildItem -Recurse -Filter "td_api.tl" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName $tl -Force; Write-Host "Copied td_api.tl from $($found.FullName)" }
            else { Write-Host "WARNING: td_api.tl missing" }
          } else { Write-Host "td_api.tl present ($((Get-Item $tl).Length) bytes)"
          $winDir = Join-Path (Get-Location) "x64-windows"
          if (-not (Test-Path (Join-Path $winDir "tdjson.dll"))) {
            Write-Host "Listing Libraries/tdjson after build:"
            Get-ChildItem -Recurse (Get-Location) -Filter "tdjson.dll" -ErrorAction SilentlyContinue | Select-Object FullName
            throw "x64-windows/tdjson.dll missing after TDLib build (need -target windows)"
          }
          Write-Host "x64-windows TDLib OK:"; Get-ChildItem $winDir | Format-Table Name, Length }

      - name: Re-stage build tools after TDLib
        working-directory: Unigram
        shell: pwsh
        run: |
          function Stage-Tool($searchRoot, $dllName, $destRel) {
            $dest = [System.IO.Path]::GetFullPath((Join-Path (Get-Location) $destRel))
            $dir = Split-Path $dest -Parent
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $found = Get-ChildItem -Recurse $searchRoot -Filter $dllName -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\bin\\' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $found) { Write-Host "WARN: $dllName missing under $searchRoot"; return }
            $src = [System.IO.Path]::GetFullPath($found.FullName)
            if ($src -ne $dest) { Copy-Item $src $dest -Force; Write-Host "Staged $src -> $dest" }
            else { Write-Host "Already at $dest" }
            Get-ChildItem $found.DirectoryName -Filter '*.dll' | ForEach-Object {
              $d2 = [System.IO.Path]::GetFullPath((Join-Path $dir $_.Name))
              $s2 = [System.IO.Path]::GetFullPath($_.FullName)
              if ($s2 -ne $d2) { Copy-Item $s2 $d2 -Force }
            }
          }
          Stage-Tool Telegram.WinUI.Rewriter Telegram.WinUI.Rewriter.dll Telegram.WinUI.Rewriter\bin\Release\net11.0\Telegram.WinUI.Rewriter.dll
          Stage-Tool Telegram.Generators.Cli Telegram.Generators.Cli.dll Telegram.Generators.Cli\bin\Release\net11.0\Telegram.Generators.Cli.dll
          Stage-Tool Telegram.Generators Telegram.Generators.dll Telegram.Generators.Cli\bin\Release\net11.0\Telegram.Generators.dll
          Stage-Tool Telegram.WinUI.Rewriter Telegram.WinUI.Rewriter.dll Telegram.WinUI.Rewriter\bin\x64\Release\net11.0\Telegram.WinUI.Rewriter.dll
          Stage-Tool Telegram.Generators.Cli Telegram.Generators.Cli.dll Telegram.Generators.Cli\bin\x64\Release\net11.0\Telegram.Generators.Cli.dll
          Stage-Tool Telegram.Generators Telegram.Generators.dll Telegram.Generators.Cli\bin\x64\Release\net11.0\Telegram.Generators.dll

      - name: Make optional native binaries non-fatal
        working-directory: Unigram
        shell: pwsh
        run: |
          # wallet-engine is not in the public Unigram tree (private/prebuilt). Without it
          # MSB3030 fails the publish. Gate Content items on Exists().
          $files = @(
            "Telegram\Telegram.WinUI.csproj",
            "Telegram\Telegram.csproj",
            "Telegram\Telegram.Modern.csproj"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { continue }
            $c = Get-Content $f -Raw
            $orig = $c
            # Add Condition=Exists if not already present on wallet_engine line
            $c = [regex]::Replace($c,
              '(<Content Include="\$\(TelegramRoot\)Libraries\\wallet-engine\\\$\(Platform\)\\wallet_engine\.dll"[^/]*?)(\s*/>)',
              {
                param($m)
                if ($m.Groups[1].Value -match 'Condition=') { return $m.Value }
                return $m.Groups[1].Value + ' Condition="Exists(''$(TelegramRoot)Libraries\wallet-engine\$(Platform)\wallet_engine.dll'')"' + $m.Groups[2].Value
              })
            if ($c -ne $orig) {
              Set-Content -Path $f -Value $c -Encoding UTF8
              Write-Host "Patched wallet_engine Exists() in $f"
            } else {
              Write-Host "No change or already conditioned: $f"
            }
          }
          # Placeholder dir so paths resolve cleanly
          New-Item -ItemType Directory -Force -Path "Libraries\wallet-engine\x64" | Out-Null
          if (-not (Test-Path "Libraries\wallet-engine\x64\wallet_engine.dll")) {
            Write-Host "wallet_engine.dll absent (expected for public clone); Content gated."
          }

      - name: Build Unigram WinUI unpackaged (Release x64)
        working-directory: Unigram
        shell: pwsh
        run: |
          if (-not (Test-Path .\Build.WinUI.ps1)) { throw "Build.WinUI.ps1 missing" }
          powershell -ExecutionPolicy Bypass -File .\Build.WinUI.ps1 -Configuration Release -Platform x64 -Unpackaged

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Recurse Unigram\Telegram\bin -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'publish' -or $_.FullName -match 'winui-unpackaged' } |
            ForEach-Object {
              Write-Host "Found publish dir: $($_.FullName)"
              Copy-Item $_.FullName "out\publish" -Recurse -Force -ErrorAction SilentlyContinue
            }
          Get-ChildItem -Recurse Unigram -Include *.msix,*.msixbundle,*.appx -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName out\ -Force }
          Get-ChildItem -Recurse Unigram -Filter "Telegram*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Release|publish|winui' } |
            Select-Object -First 20 |
            ForEach-Object {
              Write-Host "Found exe: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)"
              Copy-Item $_.FullName out\ -Force -ErrorAction SilentlyContinue
            }
          Get-ChildItem -Recurse out -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Unigram-BetterTG-client
          path: out/**
          if-no-files-found: warn
