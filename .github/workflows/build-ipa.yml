name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'Backend/**'
      - 'Website/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode:"
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode-27.2.0.app ]; then
            sudo xcode-select -s /Applications/Xcode-27.2.0.app
          elif [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
          else
            LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$LATEST" ]; then
              echo "Falling back to $LATEST"
              sudo xcode-select -s "$LATEST"
            else
              echo "No Xcode installation found"
              exit 1
            fi
          fi
          echo "Selected: $(xcode-select -p)"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen swiftformat jq
          xcodegen --version
          swiftformat --version

      - name: Configure project
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "${TELEGRAM_API_ID:-}" ] || [ -z "${TELEGRAM_API_HASH:-}" ]; then
            echo "::error::Add repository secrets TELEGRAM_API_ID and TELEGRAM_API_HASH"
            echo "Obtain them at https://my.telegram.org → API development tools"
            exit 1
          fi
          ./setup.sh \
            --api-id "$TELEGRAM_API_ID" \
            --api-hash "$TELEGRAM_API_HASH" \
            --no-relay \
            --bundle-id "com.zongai.BetterTG"

      - name: Patch build.sh for CI generic device destination
        run: |
          # build.sh defaults to Simulator when not given --device.
          # For an unsigned device IPA we force generic/platform=iOS.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("script/build.sh")
          text = p.read_text()
          old = '''else
            if [[ -z "$SIMULATOR_ID" ]]; then
              SIMULATOR_ID="$(simulator_id)"
            fi
            destination="platform=iOS Simulator,id=$SIMULATOR_ID"
            product_platform="iphonesimulator"
          fi'''
          new = '''else
            if [[ "${CI_FORCE_DEVICE_BUILD:-}" == "1" ]]; then
              destination="generic/platform=iOS"
              product_platform="iphoneos"
            else
              if [[ -z "$SIMULATOR_ID" ]]; then
                SIMULATOR_ID="$(simulator_id)"
              fi
              destination="platform=iOS Simulator,id=$SIMULATOR_ID"
              product_platform="iphonesimulator"
            fi
          fi'''
          if old not in text:
              raise SystemExit("patch target not found in script/build.sh")
          p.write_text(text.replace(old, new, 1))
          print("patched build.sh for CI_FORCE_DEVICE_BUILD")
          PY

      - name: Build (unsigned, iphoneos)
        env:
          CI_FORCE_DEVICE_BUILD: "1"
        run: |
          set -euo pipefail
          # --no-code-signing produces an unsigned product; --release for distribution-like binary
          ./build.sh build --no-code-signing --release --full-output 2>&1 | tee build.log
          # Locate the product
          APP=$(find .build -path '*/Release-iphoneos/BetterTG.app' -type d | head -1 || true)
          if [ -z "$APP" ]; then
            APP=$(find .build -name 'BetterTG.app' -type d | head -1 || true)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::BetterTG.app not found"
            find .build -type d -name '*.app' 2>/dev/null || true
            tail -80 build.log
            exit 1
          fi
          echo "Found app: $APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls -la "$APP"
          # Basic sanity: should be arm64 (device), not simulator
          file "$APP/BetterTG" || true
          lipo -info "$APP/BetterTG" 2>/dev/null || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          OUT=".build/ipa"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          cp -a "$APP" "$OUT/Payload/"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>/dev/null || echo "0.1.0")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" 2>/dev/null || echo "1")
          SHORT_SHA=$(git rev-parse --short HEAD)
          IPA_NAME="BetterTG-${VERSION}-${BUILD}-${SHORT_SHA}-unsigned.ipa"

          (cd "$OUT" && zip -r -y "../${IPA_NAME}" Payload)
          ls -lh ".build/${IPA_NAME}"
          cp ".build/${IPA_NAME}" "BetterTG-unsigned.ipa"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BetterTG-unsigned-ipa
          path: |
            .build/*-unsigned.ipa
            BetterTG-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
