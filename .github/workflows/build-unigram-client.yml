# Full Unigram (Telegram for Windows) build with BetterTG sources injected.
# Heavy: vcpkg + TDLib + WinUI 3 / .NET 11. workflow_dispatch only.
name: Build Unigram Client (BetterTG)

on:
  workflow_dispatch:
    inputs:
      unpackaged:
        description: "Build unpackaged folder (exe) instead of MSIX bundle"
        type: boolean
        default: true
      skip_native:
        description: "Skip rebuilding Telegram.Native (use if already built)"
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout BetterTG (for Windows extension sources)
        uses: actions/checkout@v4
        with:
          path: BetterTG

      - name: Verify API secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TELEGRAM_API_ID }}")) {
            throw "Missing secret TELEGRAM_API_ID"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TELEGRAM_API_HASH }}")) {
            throw "Missing secret TELEGRAM_API_HASH"
          }
          Write-Host "API secrets present."

      - name: Setup MSVC / dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup PHP (TDLib codegen)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup .NET 11 (Unigram develop TFM)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
            8.0.x

      - name: Clone Unigram (recursive, develop)
        shell: pwsh
        run: |
          git clone --recursive --depth 1 --branch develop https://github.com/TelegramMessenger/Unigram.git Unigram
          cd Unigram
          git submodule update --init --recursive --depth 1
          Write-Host "Unigram HEAD: $(git rev-parse --short HEAD)"
          Get-ChildItem | Select-Object Name

      - name: Write Constants.Secret.cs
        shell: pwsh
        run: |
          $apiId = "${{ secrets.TELEGRAM_API_ID }}"
          $apiHash = "${{ secrets.TELEGRAM_API_HASH }}"
          $content = @"
namespace Telegram
{
    public static partial class Constants
    {
        static Constants()
        {
            ApiId = $apiId;
            ApiHash = "$apiHash";
            AppChannel = "";
        }
    }
}
"@
          $path = "Unigram/Telegram/Constants.Secret.cs"
          Set-Content -Path $path -Value $content -Encoding UTF8
          Write-Host "Wrote $path"

      - name: Inject BetterTG sources
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File BetterTG/Windows/UnigramIntegration/Inject-BetterTG.ps1 `
            -UnigramRoot (Resolve-Path Unigram) `
            -BetterTGWindowsRoot (Resolve-Path BetterTG/Windows)

      - name: Pre-build Telegram.WinUI.Rewriter (path fix)
        working-directory: Unigram
        shell: pwsh
        run: |
          # Unigram expects: Telegram.WinUI.Rewriter\bin\Release\net11.0\Telegram.WinUI.Rewriter.dll
          # Building with Platform=x64 places it under bin\x64\Release\ instead.
          $proj = "Telegram.WinUI.Rewriter\Telegram.WinUI.Rewriter.csproj"
          dotnet build $proj -c Release -p:Platform=AnyCPU -v:minimal
          $expectedDir = "Telegram.WinUI.Rewriter\bin\Release\net11.0"
          $expectedDll = Join-Path $expectedDir "Telegram.WinUI.Rewriter.dll"
          if (-not (Test-Path $expectedDll)) {
            $found = Get-ChildItem -Recurse "Telegram.WinUI.Rewriter\bin" -Filter "Telegram.WinUI.Rewriter.dll" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $found) { throw "Rewriter DLL not produced" }
            New-Item -ItemType Directory -Force -Path $expectedDir | Out-Null
            Copy-Item $found.FullName $expectedDll -Force
            Write-Host "Copied rewriter from $($found.FullName) -> $expectedDll"
          } else {
            Write-Host "Rewriter OK at $expectedDll"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TDLib (x64 windows)
        working-directory: Unigram/Libraries/tdjson
        shell: pwsh
        run: |
          if (-not (Test-Path .\build.ps1)) { throw "tdjson/build.ps1 missing" }
          powershell -ExecutionPolicy Bypass ./build.ps1 -arch x64

      - name: Build Unigram WinUI (Release x64)
        working-directory: Unigram
        shell: pwsh
        run: |
          if (-not (Test-Path .\Build.WinUI.ps1)) { throw "Build.WinUI.ps1 missing" }
          $args = @('-Configuration', 'Release', '-Platform', 'x64')
          if ('${{ inputs.unpackaged }}' -eq 'true') {
            $args += '-Unpackaged'
          }
          if ('${{ inputs.skip_native }}' -eq 'true') {
            $args += '-SkipNative'
          }
          Write-Host "Running Build.WinUI.ps1 $($args -join ' ')"
          powershell -ExecutionPolicy Bypass -File .\Build.WinUI.ps1 @args

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # Unpackaged publish folder
          Get-ChildItem -Recurse Unigram\Telegram\bin -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'publish' -or $_.FullName -match 'winui-unpackaged' } |
            ForEach-Object {
              Write-Host "Found publish dir: $($_.FullName)"
              $dest = "out\$($_.Parent.Name)-$($_.Name)"
              Copy-Item $_.FullName $dest -Recurse -Force -ErrorAction SilentlyContinue
            }
          # MSIX / APPX
          Get-ChildItem -Recurse Unigram -Include *.msix,*.msixbundle,*.appx -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "Found package: $($_.FullName)"
              Copy-Item $_.FullName out\ -Force
            }
          # Any Telegram*.exe under Release
          Get-ChildItem -Recurse Unigram -Filter "Telegram*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Release|publish|winui' } |
            Select-Object -First 20 |
            ForEach-Object {
              Write-Host "Found exe: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)"
              Copy-Item $_.FullName out\ -Force -ErrorAction SilentlyContinue
            }
          Write-Host "=== out/ ==="
          Get-ChildItem -Recurse out -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Unigram-BetterTG-client
          path: out/**
          if-no-files-found: warn
