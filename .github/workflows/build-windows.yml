# Build BetterTG.Windows core library — independent of iOS IPA workflow
name: Build BetterTG.Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'Windows/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build BetterTG.Windows.csproj -c Release -v minimal
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterTG.Windows
          path: Windows/bin/Release/net8.0/**
          if-no-files-found: error
