name: Build Unsigned IPA

# 默认 push/commit 不触发构建；仅手动 Run workflow 时构建
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          echo "Available Xcode:"
          ls /Applications | grep -i xcode || true
          for candidate in \
            /Applications/Xcode_26.3.0.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode-26.3.0.app \
            /Applications/Xcode-26.3.app
          do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              echo "Selected: $candidate"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::error::Xcode 26.3 not found on runner"
          exit 1

      - name: Install tools
        run: |
          brew install xcodegen swiftformat jq
          xcodegen --version

      - name: Configure project
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "${TELEGRAM_API_ID:-}" ] || [ -z "${TELEGRAM_API_HASH:-}" ]; then
            echo "::error::Add repository secrets TELEGRAM_API_ID and TELEGRAM_API_HASH"
            exit 1
          fi
          ./setup.sh \
            --api-id "$TELEGRAM_API_ID" \
            --api-hash "$TELEGRAM_API_HASH" \
            --no-relay \
            --bundle-id "com.zongai.BetterTG"

      - name: Patch build.sh for CI generic device destination
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("script/build.sh")
          text = p.read_text()
          old = '''else
            if [[ -z "$SIMULATOR_ID" ]]; then
              SIMULATOR_ID="$(simulator_id)"
            fi
            destination="platform=iOS Simulator,id=$SIMULATOR_ID"
            product_platform="iphonesimulator"
          fi'''
          new = '''else
            if [[ "${CI_FORCE_DEVICE_BUILD:-}" == "1" ]]; then
              destination="generic/platform=iOS"
              product_platform="iphoneos"
            else
              if [[ -z "$SIMULATOR_ID" ]]; then
                SIMULATOR_ID="$(simulator_id)"
              fi
              destination="platform=iOS Simulator,id=$SIMULATOR_ID"
              product_platform="iphonesimulator"
            fi
          fi'''
          if old not in text:
              raise SystemExit("patch target not found in script/build.sh")
          p.write_text(text.replace(old, new, 1))
          print("patched build.sh for CI_FORCE_DEVICE_BUILD")
          PY

      - name: Build (unsigned, iphoneos)
        env:
          CI_FORCE_DEVICE_BUILD: "1"
        run: |
          set -euo pipefail
          ./build.sh build --no-code-signing --release --full-output 2>&1 | tee build.log
          APP=$(find .build -path '*/Release-iphoneos/BetterTG.app' -type d | head -1 || true)
          if [ -z "$APP" ]; then
            APP=$(find .build -name 'BetterTG.app' -type d | head -1 || true)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::BetterTG.app not found"
            tail -80 build.log
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          file "$APP/BetterTG" || true
          lipo -info "$APP/BetterTG" 2>/dev/null || true

      - name: Package unsigned IPA
        id: ipa
        run: |
          set -euo pipefail
          OUT=".build/ipa"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          cp -a "$APP" "$OUT/Payload/"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>/dev/null || echo "0.1.0")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" 2>/dev/null || echo "1")
          RUN="${GITHUB_RUN_NUMBER}"
          # User-facing name pattern (BetterTG, not Telegram — this is the BetterTG fork)
          IPA_NAME="BetterTG-${VERSION}-${BUILD}-build${RUN}.ipa"

          (cd "$OUT" && zip -r -y "../${IPA_NAME}" Payload)
          ls -lh ".build/${IPA_NAME}"
          IPA_SIZE=$(stat -f%z ".build/${IPA_NAME}" 2>/dev/null || stat -c%s ".build/${IPA_NAME}")
          cp ".build/${IPA_NAME}" "BetterTG-unsigned.ipa"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "ipa_size=${IPA_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterTG-unsigned-ipa
          path: |
            .build/*-build*.ipa
            BetterTG-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # On successful main builds only: publish Release first, then rewrite sidestore source.
      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BetterTG ${{ steps.ipa.outputs.version }} (build ${{ github.run_number }})
          body: |
            Unsigned IPA for SideStore / TrollStore style install.
            Version ${{ steps.ipa.outputs.version }} (${{ steps.ipa.outputs.build }}).
            SideStore version: ${{ steps.ipa.outputs.version }}-build${{ github.run_number }}
          files: .build/${{ steps.ipa.outputs.ipa_name }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update sidestore-apps.json
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          VERSION="${{ steps.ipa.outputs.version }}"
          BUILD="${{ steps.ipa.outputs.build }}"
          IPA_NAME="${{ steps.ipa.outputs.ipa_name }}"
          IPA_SIZE="${{ steps.ipa.outputs.ipa_size }}"
          RUN="${{ github.run_number }}"
          DATE=$(date -u +"%Y-%m-%d")
          DISPLAY_VERSION="${VERSION}-build${RUN}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/build-${RUN}/${IPA_NAME}"
          SOURCE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/sidestore-apps.json"
          jq \
            --arg file "$IPA_NAME" \
            --arg version "$DISPLAY_VERSION" \
            --arg date "$DATE" \
            --arg desc "BetterTG ${VERSION} (${BUILD}) unsigned CI build #${RUN}" \
            --arg downloadURL "$DOWNLOAD_URL" \
            --arg sourceURL "$SOURCE_URL" \
            --argjson size "$IPA_SIZE" \
            '
            .sourceURL = $sourceURL |
            .apps[0].file = $file |
            .apps[0].downloadURL = $downloadURL |
            .apps[0].version = $version |
            .apps[0].versionDate = $date |
            .apps[0].versionDescription = $desc |
            .apps[0].size = $size
            ' sidestore-apps.json > sidestore-apps.json.tmp
          mv sidestore-apps.json.tmp sidestore-apps.json
          echo "=== sidestore-apps.json (must match Release asset) ==="
          cat sidestore-apps.json
          test "$(jq -r '.apps[0].version' sidestore-apps.json)" = "$DISPLAY_VERSION"
          test "$(jq -r '.apps[0].file' sidestore-apps.json)" = "$IPA_NAME"
          test "$(jq -r '.apps[0].downloadURL' sidestore-apps.json)" = "$DOWNLOAD_URL"
          test "$(jq -r '.apps[0].size' sidestore-apps.json)" = "$IPA_SIZE"
          echo "sidestore fields verified against build outputs"

      # 通过 Contents API 回写 main 上的 sidestore-apps.json，避免 git push 被
      # branch ruleset (commit_refs_rules) 拒绝；优先使用 GH_PAT（若已配置）。
      - name: Publish sidestore-apps.json via API
        id: sidestore_commit
        if: success() && github.ref == 'refs/heads/main'
        env:
          # Optional PAT with Contents:write that is allowed by repo rulesets.
          # Falls back to GITHUB_TOKEN when GH_PAT is unset.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          PATH_IN_REPO="sidestore-apps.json"
          API="https://api.github.com/repos/${REPO}/contents/${PATH_IN_REPO}"
          MSG="chore(ci): update sidestore-apps.json for build ${{ github.run_number }}"

          CONTENT_B64=$(openssl base64 -A -in sidestore-apps.json)

          # Fetch current SHA (required for updates); tolerate missing file.
          META=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "${API}?ref=main" || true)
          SHA=$(echo "$META" | jq -r '.sha // empty')

          PAYLOAD=$(jq -n             --arg message "$MSG"             --arg content "$CONTENT_B64"             --arg branch "main"             --arg sha "$SHA"             'if $sha == "" then
               {message:$message, content:$content, branch:$branch}
             else
               {message:$message, content:$content, branch:$branch, sha:$sha}
             end')

          echo "Uploading sidestore-apps.json via Contents API…"
          RESP=$(curl -sS -X PUT             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "${API}"             -d "$PAYLOAD")

          if echo "$RESP" | jq -e '.content.sha' >/dev/null 2>&1; then
            echo "sidestore-apps.json published: $(echo "$RESP" | jq -r '.content.sha')"
            echo "commit=$(echo "$RESP" | jq -r '.commit.sha')"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          elif echo "$RESP" | jq -e '.message' >/dev/null 2>&1; then
            echo "::error::Contents API failed: $(echo "$RESP" | jq -r '.message')"
            echo "$RESP" | jq .
            exit 1
          else
            echo "::error::Unexpected Contents API response"
            echo "$RESP"
            exit 1
          fi

          # Round-trip verify raw.githubusercontent / API content matches IPA fields
          sleep 2
          REMOTE=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github.raw"             -H "X-GitHub-Api-Version: 2022-11-28"             "${API}?ref=main")
          echo "Remote sidestore after publish:"
          echo "$REMOTE" | jq .
          test "$(echo "$REMOTE" | jq -r '.apps[0].file')" = "${{ steps.ipa.outputs.ipa_name }}"
          test "$(echo "$REMOTE" | jq -r '.apps[0].downloadURL')" = "https://github.com/${REPO}/releases/download/build-${{ github.run_number }}/${{ steps.ipa.outputs.ipa_name }}"
          echo "Remote sidestore verified against this build"

      # Contents API 提交不一定触发 push 级联；显式 dispatch 重建 SideStore 源
      - name: Trigger rebuild-sidestore.yml
        if: success() && github.ref == 'refs/heads/main' && steps.sidestore_commit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Dispatching Rebuild SideStore Source workflow…"
          curl --fail-with-body -sS -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rebuild-sidestore.yml/dispatches"             -d '{"ref":"main"}'
          echo
          echo "rebuild-sidestore.yml dispatched"
