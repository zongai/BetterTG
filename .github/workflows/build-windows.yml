# Build BetterTG.Windows library + publish WinExe
name: Build BetterTG.Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'Windows/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-lib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build library
        run: dotnet build BetterTG.Windows.csproj -c Release -v minimal

  publish-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained win-x64 exe
        working-directory: Windows/App
        run: |
          dotnet publish BetterTG.Windows.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -v minimal
      - name: Stage release files
        shell: pwsh
        run: |
          $out = "Windows/publish"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $pub = Get-ChildItem -Recurse "Windows/App/bin/Release" -Filter "BetterTG.Windows.App.exe" |
            Where-Object { $_.FullName -match "publish" } | Select-Object -First 1
          if (-not $pub) {
            Get-ChildItem -Recurse Windows/App/bin -ErrorAction SilentlyContinue | Out-String | Write-Host
            throw "exe not found"
          }
          Copy-Item $pub.FullName "$out/BetterTG.Windows.exe"
          Copy-Item "Windows/README.md" "$out/" -ErrorAction SilentlyContinue
          if (Test-Path "Windows/Docs") { Copy-Item "Windows/Docs" "$out/Docs" -Recurse -Force }
          Get-ChildItem $out | Format-Table Name, Length
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: BetterTG.Windows-exe
          path: Windows/publish/**
          if-no-files-found: error
