# Pure Unigram (no BetterTG inject) — bisect CI crash vs official.
# Default: tag v13.2.4, PublishAot=true (matches official). workflow_dispatch only.
name: Build Unigram Client (BetterTG)

on:
  workflow_dispatch:
    inputs:
      inject_bettertg:
        description: "Inject BetterTG sources (false = pure Unigram bisect)"
        type: boolean
        default: false
      publish_aot:
        description: "PublishAot (true = official default)"
        type: boolean
        default: true
      unigram_ref:
        description: "Unigram git ref (tag or commit)"
        type: string
        default: "v13.2.4"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout BetterTG (for Windows extension sources)
        uses: actions/checkout@v4
        with:
          path: BetterTG

      - name: Verify API secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TELEGRAM_API_ID }}")) { throw "Missing secret TELEGRAM_API_ID" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TELEGRAM_API_HASH }}")) { throw "Missing secret TELEGRAM_API_HASH" }
          Write-Host "API secrets present."
          Write-Host "inject_bettertg=${{ inputs.inject_bettertg }}"
          Write-Host "publish_aot=${{ inputs.publish_aot }}"
          Write-Host "unigram_ref=${{ inputs.unigram_ref }}"

      - name: Setup MSVC / dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup PHP (TDLib codegen)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup .NET 11 (Unigram TFM)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
            8.0.x

      - name: Clone Unigram (recursive, pinned ref)
        shell: pwsh
        run: |
          $ref = "${{ inputs.unigram_ref }}"
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = "v13.2.4" }
          git clone https://github.com/TelegramMessenger/Unigram.git Unigram
          cd Unigram
          git checkout $ref
          git submodule update --init --recursive
          Write-Host "Unigram HEAD: $(git rev-parse HEAD)"
          Write-Host "Unigram describe: $(git describe --tags --always)"

      - name: Write Constants.Secret.cs
        shell: pwsh
        run: |
          $apiId = "${{ secrets.TELEGRAM_API_ID }}"
          $apiHash = "${{ secrets.TELEGRAM_API_HASH }}"
          $lines = @(
            'namespace Telegram',
            '{',
            '    public static partial class Constants',
            '    {',
            '        static Constants()',
            '        {',
            "            ApiId = $apiId;",
            "            ApiHash = `"$apiHash`";",
            '            AppChannel = "";',
            '        }',
            '    }',
            '}'
          )
          Set-Content -Path "Unigram/Telegram/Constants.Secret.cs" -Value ($lines -join "`n") -Encoding UTF8
          Write-Host "Wrote Constants.Secret.cs"

      - name: Inject BetterTG sources
        if: ${{ inputs.inject_bettertg == true || inputs.inject_bettertg == 'true' }}
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File BetterTG/Windows/UnigramIntegration/Inject-BetterTG.ps1 -UnigramRoot (Resolve-Path Unigram) -BetterTGWindowsRoot (Resolve-Path BetterTG/Windows)

      - name: Skip BetterTG inject (pure Unigram)
        if: ${{ inputs.inject_bettertg != true && inputs.inject_bettertg != 'true' }}
        shell: pwsh
        run: Write-Host "Pure Unigram build — BetterTG not injected (bisect mode)."

      - name: Patch upstream string key mismatches
        shell: pwsh
        working-directory: Unigram
        run: |
          $popup = "Telegram/Views/Popups/DeleteMessagesPopup.xaml.cs"
          if (Test-Path $popup) {
            $c = Get-Content $popup -Raw
            $n = $c
            $n = $n.Replace('Strings.DeleteAllMessagesFromUsers', 'Strings.DeleteAllFromUsers')
            $n = $n.Replace('Strings.DeleteAllReactionsFromUsers', 'Strings.DeleteAllFromUsers')
            if ($n -ne $c) {
              Set-Content $popup $n -NoNewline
              Write-Host "Patched DeleteMessagesPopup string keys"
            } else {
              Write-Host "DeleteMessagesPopup: no DeleteAll*FromUsers mismatch (OK)"
            }
          }
          $res = "Telegram/Assets/Strings/en/Resources.xml"
          if (Test-Path $res) {
            $c = Get-Content $res -Raw
            $changed = $false
            if ($c -notmatch 'name="DeleteAllMessagesFromUsers"') {
              $c = $c -replace '(</resources>\s*)$', "  <string name=`"DeleteAllMessagesFromUsers`">Delete all messages from users</string>`r`n</resources>`r`n"
              $changed = $true
            }
            if ($c -notmatch 'name="DeleteAllReactionsFromUsers"') {
              $c = $c -replace '(</resources>\s*)$', "  <string name=`"DeleteAllReactionsFromUsers`">Delete all reactions from users</string>`r`n</resources>`r`n"
              $changed = $true
            }
            if ($changed) {
              Set-Content $res $c -NoNewline
              Write-Host "Patched Resources.xml missing keys"
            }
          }

      - name: Pre-build AnyCPU tools (Generators + Rewriter)
        shell: pwsh
        working-directory: Unigram
        run: |
          function Stage-Tool([string]$project, [string]$dllName) {
            Write-Host "Building $project ..."
            dotnet build $project -c Release -p:Platform=AnyCPU
            if ($LASTEXITCODE -ne 0) { throw "Failed: $project" }
            $name = [IO.Path]::GetFileNameWithoutExtension($project)
            $srcRoot = Join-Path $name "bin"
            $candidates = @(
              (Join-Path $srcRoot "Release/net11.0/$dllName"),
              (Join-Path $srcRoot "x64/Release/net11.0/$dllName"),
              (Join-Path $srcRoot "Release/net8.0/$dllName")
            ) | Where-Object { Test-Path $_ }
            if (-not $candidates) {
              Get-ChildItem -Recurse $srcRoot -Filter $dllName -ErrorAction SilentlyContinue | Select-Object -First 5 FullName
              throw "DLL not found: $dllName under $srcRoot"
            }
            $src = $candidates[0]
            foreach ($destRoot in @("bin/Release/net11.0", "bin/x64/Release/net11.0")) {
              New-Item -ItemType Directory -Force -Path $destRoot | Out-Null
              $dest = Join-Path $destRoot $dllName
              $srcFull = [IO.Path]::GetFullPath($src)
              $destFull = [IO.Path]::GetFullPath($dest)
              if ($srcFull -ne $destFull) {
                Copy-Item $src $dest -Force
                Write-Host "Staged $dest"
              } else {
                Write-Host "Already at $dest"
              }
            }
          }
          Stage-Tool "Telegram.WinUI.Rewriter/Telegram.WinUI.Rewriter.csproj" "Telegram.WinUI.Rewriter.dll"
          Stage-Tool "Telegram.Generators.Cli/Telegram.Generators.Cli.csproj" "Telegram.Generators.Cli.dll"

      - name: Build TDLib (x64 windows)
        shell: pwsh
        working-directory: Unigram
        run: |
          ./Libraries/build.ps1 -arch x64 -target windows
          $td = "Libraries/tdjson/x64-windows/tdjson.dll"
          if (-not (Test-Path $td)) { throw "Missing $td after TDLib build" }
          Write-Host "x64-windows TDLib OK:"
          Get-ChildItem "Libraries/tdjson/x64-windows" | Format-Table Name, Length

      - name: Re-stage tools after TDLib
        shell: pwsh
        working-directory: Unigram
        run: |
          foreach ($pair in @(
            @("Telegram.WinUI.Rewriter", "Telegram.WinUI.Rewriter.dll"),
            @("Telegram.Generators.Cli", "Telegram.Generators.Cli.dll")
          )) {
            $name = $pair[0]; $dll = $pair[1]
            $src = Get-ChildItem -Recurse "$name/bin" -Filter $dll -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $src) { Write-Host "WARN: no $dll"; continue }
            foreach ($destRoot in @("bin/Release/net11.0", "bin/x64/Release/net11.0")) {
              New-Item -ItemType Directory -Force -Path $destRoot | Out-Null
              $dest = Join-Path $destRoot $dll
              if ([IO.Path]::GetFullPath($src.FullName) -ne [IO.Path]::GetFullPath($dest)) {
                Copy-Item $src.FullName $dest -Force
              }
            }
            Write-Host "Re-staged $dll"
          }

      - name: Gate optional wallet_engine.dll
        shell: pwsh
        working-directory: Unigram
        run: |
          Get-ChildItem -Recurse -Filter "*.csproj" | ForEach-Object {
            $f = $_.FullName
            $c = Get-Content $f -Raw
            if ($c -match 'wallet_engine\.dll' -and $c -notmatch 'wallet_engine\.dll.*Exists') {
              $n = [regex]::Replace(
                $c,
                '(<Content Include="\$\(TelegramRoot\)Libraries\\wallet-engine\\\$\(Platform\)\\wallet_engine\.dll"[^/]*?)(\s*/>)',
                {
                  param($m)
                  if ($m.Value -match 'Condition=') { return $m.Value }
                  return $m.Groups[1].Value + ' Condition="Exists(''$(TelegramRoot)Libraries\wallet-engine\$(Platform)\wallet_engine.dll'')"' + $m.Groups[2].Value
                }
              )
              if ($n -ne $c) {
                Set-Content $f $n -NoNewline
                Write-Host "Patched wallet_engine Exists() in $f"
              }
            }
          }
          New-Item -ItemType Directory -Force -Path "Libraries\wallet-engine\x64" | Out-Null
          Write-Host "wallet_engine gated."

      - name: Configure PublishAot
        shell: pwsh
        working-directory: Unigram
        run: |
          $wantAot = "${{ inputs.publish_aot }}"
          $aotTrue = ($wantAot -eq "true" -or $wantAot -eq "True" -or $wantAot -eq $true)
          $csproj = "Telegram/Telegram.WinUI.csproj"
          $c = Get-Content $csproj -Raw
          if ($aotTrue) {
            Write-Host "Keeping/restoring PublishAot=true (official default)"
            # Ensure true for Release
            if ($c -match '<PublishAot>false</PublishAot>') {
              $c = $c.Replace('<PublishAot>false</PublishAot>', '<PublishAot Condition=''$(Configuration)'' != ''Debug''>true</PublishAot>')
              Set-Content $csproj $c -NoNewline
            }
          } else {
            Write-Host "Forcing PublishAot=false"
            $old = '<PublishAot Condition=''$(Configuration)'' != ''Debug''>true</PublishAot>'
            if ($c.Contains($old)) {
              $c = $c.Replace($old, '<PublishAot>false</PublishAot>')
            } else {
              $c = [regex]::Replace($c, '<PublishAot[^>]*>\s*true\s*</PublishAot>', '<PublishAot>false</PublishAot>')
            }
            Set-Content $csproj $c -NoNewline
          }
          Select-String -Path $csproj -Pattern 'PublishAot' | ForEach-Object { $_.Line.Trim() }

          $ps1 = "Telegram/Build.WinUI.ps1"
          if (Test-Path $ps1) {
            $p = Get-Content $ps1 -Raw
            if (-not $aotTrue) {
              $needle = "'-p:Unpackaged=true',"
              $insert = "'-p:Unpackaged=true',`r`n          '-p:PublishAot=false',"
              if ($p.Contains($needle) -and -not $p.Contains("PublishAot=false")) {
                $p = $p.Replace($needle, $insert)
                Set-Content $ps1 $p -NoNewline
                Write-Host "Build.WinUI.ps1: added -p:PublishAot=false"
              }
            }
            # Soften PDB check so non-AOT/AOT layout differences do not fail the job after zip exists
            if ($p -match 'No PDB matching') {
              $p2 = [regex]::Replace($p, 'throw\s+"No PDB matching[^"]*"', 'Write-Warning "No PDB matching Telegram.dll (non-fatal)"')
              if ($p2 -ne $p) {
                Set-Content $ps1 $p2 -NoNewline
                Write-Host "Build.WinUI.ps1: PDB mismatch is non-fatal"
              }
            }
          }

      - name: Build Unigram WinUI unpackaged
        shell: pwsh
        working-directory: Unigram
        run: |
          ./Telegram/Build.WinUI.ps1 -Configuration Release -Platform x64 -Unpackaged

      - name: Collect output
        if: success() || failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $zip = Get-ChildItem -Path "Unigram/Telegram/bin/winui-unpackaged" -Recurse -Filter "Telegram-*-x64.zip" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "out/$($zip.Name)" -Force
            Write-Host "Official zip: $($zip.FullName) ($([math]::Round($zip.Length/1MB,1)) MB)"
          } else {
            Write-Host "WARNING: Telegram-*-x64.zip not found"
          }
          $pub = "Unigram/Telegram/bin/winui-unpackaged/x64/Release/publish"
          if (Test-Path (Join-Path $pub "Telegram.exe")) {
            $len = (Get-Item (Join-Path $pub "Telegram.exe")).Length
            Write-Host "Publish folder OK ($([math]::Round($len/1MB,1)) MB Telegram.exe)"
            Compress-Archive -Path "$pub/*" -DestinationPath "out/Telegram-publish-folder-x64.zip" -Force
          }
          Get-ChildItem -Path "Unigram/Telegram/bin/winui-unpackaged" -Recurse -Filter "Telegram-*-setup.exe" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item $_.FullName "out/$($_.Name)" -Force
              Write-Host "Setup: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)"
            }
          "inject=${{ inputs.inject_bettertg }}" | Out-File out/build-meta.txt -Encoding utf8
          "aot=${{ inputs.publish_aot }}" | Out-File out/build-meta.txt -Append -Encoding utf8
          "ref=${{ inputs.unigram_ref }}" | Out-File out/build-meta.txt -Append -Encoding utf8
          Get-ChildItem out | Format-Table Name, Length -AutoSize

      - name: Upload client artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Unigram-client-${{ inputs.inject_bettertg && 'bettertg' || 'pure' }}-aot${{ inputs.publish_aot }}
          path: out/**
          if-no-files-found: warn
